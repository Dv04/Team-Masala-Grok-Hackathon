name: Bug report
description: Report a starter bug
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module ownership
      placeholder: frontend / agents / tools / qa
    validations:
      required: true
